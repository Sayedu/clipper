event:
  id: hot_potato
  name: "Hot Potato"

arena:
  radius: 420
  center: [540, 800]
  segments: 180   # was 96 -- more, shorter segments approximate the circle's
                  # curve more smoothly, so a ball rolling along the wall
                  # doesn't feel a little stutter crossing each seam
  thickness: 10

gravity: 900

balls:
  radius: 30
  per_team: 4
  elasticity: 0.99   # was 0.95, then 0.97 -- asked again for harder ball-ball
                      # bounces; matches Ring of Doom's own tuned ceiling
  friction: 0.05      # was 0.15, then 0.08 -- as little grip as still stable,
                       # so almost none of a collision's energy is lost to it

physics:
  step_hz: 240
  max_speed: 3200   # was 2800 -- harder bounces need the cap raised too,
                     # or they'd just get clamped back down right after
  wall_thickness: 6

bomb:
  round_sec_start: 4.0        # was 6.0 -- the whole point is a quick, snappy video
  round_sec_min: 1.2          # was 2.0
  round_sec_decay: 0.78       # was 0.85 -- each round's own duration = max(round_sec_min, prev * this)
  pass_cooldown_sec: 0.15     # a prolonged single touch can't ping-pong the bomb every physics step
  warning_sec: 1.2            # ticking cues (see direct.py) lead up to this many seconds before a deadline

timing:
  sim_deadline_sec: 60.0
  video_min_sec: 61.0         # vestigial: enforce_duration_window=False means this is never checked
  video_max_sec: 70.0         # still used as a safety-trim ceiling in direct.py
