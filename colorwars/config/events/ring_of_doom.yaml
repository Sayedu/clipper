event:
  id: ring_of_doom
  name: "Ring of Doom"

ring:
  radius: 400
  center: [540, 820]
  segments: 96
  thickness: 10
  initial_gap_deg: 16
  rotation_speed: 1.1               # rad/s -- was 0.6, nearly double for a faster spin
  rotation_speedup_per_phase: 0.07  # +7% speed each gap-widening phase, was 4%
  reverse_once: true

gravity: 900

balls:
  radius: 30
  per_team: 4
  elasticity: 0.96   # was 0.88 -- bouncier, close to a superball (kept under 1.0 for solver stability)
  friction: 0.15     # was 0.4 -- less friction bleeds off less speed on every bounce

elimination_radius: 440

gaps:
  initial_count: 1
  widen_deg: 6
  max_gaps: 3
  interval_sec: 8.0
  warning_sec: 1.0
  fast_interval_sec: 4.0
  fast_after_sec: 48.0

hazards:
  interval_min_sec: 9.0
  interval_max_sec: 13.0
  warning_sec: 1.0
  types: [lightning, center_bumper, spinner_bar]
  center_bumper_duration_sec: 5.0
  spinner_bar_duration_sec: 6.0

physics:
  step_hz: 240
  max_speed: 3200   # was 2400 -- balls can move noticeably faster now
  wall_thickness: 6
  anti_stuck_distance_px: 30
  anti_stuck_window_sec: 1.5

timing:
  sim_deadline_sec: 66.0
  video_min_sec: 61.0
  video_max_sec: 70.0
