event:
  id: ring_of_doom
  name: "Ring of Doom"

ring:
  radius: 400
  center: [540, 770]   # was 820 -- moved up to free more room for the bigger roster below it
  segments: 96
  thickness: 10
  initial_gap_deg: 16
  rotation_speed: 1.1               # rad/s -- was 0.6, nearly double for a faster spin
  rotation_speedup_per_phase: 0.07  # +7% speed each gap-widening phase, was 4%
  reverse_once: false  # was true, but ignored -- the ring always reversed regardless; now it's a real toggle, off by request

gravity: 900

balls:
  radius: 30
  per_team: 4
  elasticity: 0.99   # was 0.88, then 0.96 -- asked again for more bounce; as close to a real superball as the solver stays stable at
  friction: 0.1      # was 0.4, then 0.15 -- bounces keep almost all their speed now

elimination_radius: 440

gaps:
  initial_count: 1
  widen_deg: 6
  max_gaps: 1   # was 3 -- only ever one opening in the wall, by request (it only ever widens now, never opens a second one)
  interval_sec: 8.0
  warning_sec: 1.0
  fast_interval_sec: 4.0
  fast_after_sec: 48.0

hazards:
  interval_min_sec: 9.0
  interval_max_sec: 13.0
  warning_sec: 1.0
  # center_bumper/spinner_bar removed by request -- no obstacle sitting in
  # the middle of the ring anymore. lightning stays (it strikes a ball
  # directly, not a fixed thing in the middle).
  types: [lightning]
  center_bumper_duration_sec: 5.0
  spinner_bar_duration_sec: 6.0

physics:
  step_hz: 240
  max_speed: 3200   # was 2400 -- balls can move noticeably faster now
  wall_thickness: 6
  # anti_stuck_distance_px/anti_stuck_window_sec used to live here -- a
  # ball that hadn't moved far enough in a while got a random, invisible
  # impulse "out of nowhere" by request, removed: a ball should only ever
  # move because something physical touched it (and the ring's own
  # spinning, ever-widening gap already guarantees nothing can stay
  # trapped forever; mining/find-seed reject the rare seed where it
  # somehow would, same as any other invalid run).

timing:
  sim_deadline_sec: 66.0
  video_min_sec: 61.0
  video_max_sec: 70.0
