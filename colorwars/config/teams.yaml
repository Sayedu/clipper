# Four color teams. Trait numbers are read by each event's sim -- an event
# is free to use only the traits that make sense for it.
teams:
  - id: red
    name: Red
    color: "#FF4D5E"
    personality: "Heavy hitters -- hard to knock off course."
    traits:
      mass_mult: 1.15
      duel_power: 1.889    # Champion Duel: px of spike reach gained per hit landed -- tuned by `colorwars balance`
  - id: blue
    name: Blue
    color: "#3DA5FF"
    personality: "Bouncy and a little unpredictable."
    traits:
      elasticity_add: 0.08
      duel_power: 12.68    # Champion Duel: degrees of shield arc gained per hit landed -- tuned by `colorwars balance`
  - id: green
    name: Green
    color: "#3DDC84"
    personality: "Small and slippery."
    traits:
      radius_mult: 0.9
      duel_power: 0.7785    # Champion Duel: damage per mini-twin hit -- tuned by `colorwars balance`
  - id: yellow
    name: Yellow
    color: "#FFD23F"
    personality: "Wildcards in Disaster Drop (random bursts of speed); steady everywhere else."
    traits:
      # burst_impulse/burst_interval_*_sec are read by Disaster Drop's sim
      # only -- Ring of Doom used to apply this same burst too (hardcoded to
      # team_id=="yellow", not actually reading these trait values), but that
      # was removed by request: it was a silent, unwarned random impulse that
      # just looked like a ball going crazy with no visible cause, unlike
      # lightning/hazards which are telegraphed first. Left in place here so
      # Disaster Drop (which does read these) is unaffected.
      burst_impulse: true
      burst_interval_min_sec: 4
      burst_interval_max_sec: 7
      duel_power: 0.07287   # Champion Duel: speed fraction gained per hit landed -- tuned by `colorwars balance`
