<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Follow The Ball</title>

<script>
  var _q = new URLSearchParams(location.search);
  if (_q.get('render') === '1') document.documentElement.classList.add('rmode');
  // embed mode (web-app studio iframe): the React page provides the controls,
  // so hide the built-in #studio panel and let the stage fill the frame.
  if (_q.get('embed') === '1') document.documentElement.classList.add('embed');
</script>

<style>
  /* relative paths so the page works BOTH from the render server (rooted at the
     repo) and from the worker's /render/followball/ + /assets/fonts/ routes. */
  @font-face{ font-family:"Chakra Petch"; font-weight:500; font-display:block;
    src:url("../../assets/fonts/ChakraPetch-Medium.ttf") format("truetype"); }
  @font-face{ font-family:"Chakra Petch"; font-weight:600; font-display:block;
    src:url("../../assets/fonts/ChakraPetch-SemiBold.ttf") format("truetype"); }
  @font-face{ font-family:"Chakra Petch"; font-weight:700; font-display:block;
    src:url("../../assets/fonts/ChakraPetch-Bold.ttf") format("truetype"); }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    margin:0; color:#fff;
    background:radial-gradient(120% 80% at 50% 0%, #101a30 0%, #06060c 60%), #06060c;
    font-family:"Chakra Petch","DIN Alternate",system-ui,sans-serif;
    overflow:hidden; display:flex; align-items:center; justify-content:center; gap:22px;
    -webkit-font-smoothing:antialiased;
  }
  html:not(.rmode) body{ overflow:auto; padding:16px; }
  html:not(.rmode) #stage{ height:min(94dvh, calc((100vw - 380px) * 16 / 9)); }
  @media (max-width:760px){
    html:not(.rmode) body{ flex-direction:column; }
    html:not(.rmode) #stage{ height:auto; width:min(94vw, 52dvh); }
    #studio{ width:min(94vw, 420px) !important; }
  }
  @keyframes fbPop{0%{transform:scale(.55);opacity:0}62%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:1}}

  /* the game frame — the design's: aspect-locked, container-type:size (needed for
     cqh/cqw), rounded, the soft blue bloom + field radial. */
  #stage{
    position:relative; container-type:size;
    aspect-ratio:9/16; height:98dvh; max-width:98vw;
    border-radius:26px; overflow:hidden; background:#05050b;
    box-shadow:0 0 0 1px #1d2b4a, 0 0 60px rgba(0,140,255,.14), 0 30px 90px rgba(0,0,0,.7);
  }
  @media (max-aspect-ratio:9/16){ #stage{height:auto;width:98vw} }
  #c{display:block;width:100%;height:100%}

  /* ── HUD — SPEC §7, pulled down + tightened so the round / difficulty / pips
     row clears TikTok's top chrome and reads clearly ── */
  #hud{position:absolute;left:0;right:0;top:4cqh;height:9cqh;
    display:flex;flex-direction:column;justify-content:flex-end;gap:1.8cqw;
    padding:0 4cqw 0;box-sizing:border-box;pointer-events:none}
  #hudTop{display:flex;align-items:baseline;justify-content:space-between}
  #hudTop span{font-weight:700;font-size:3.9cqw;letter-spacing:.18em;text-transform:uppercase}
  #roundLabel{color:rgba(255,255,255,.62)}
  #pips{display:flex;gap:1.4cqw;height:2cqw}
  #pips > i{display:block}

  #big{position:absolute;left:0;right:0;top:19cqh;
    display:flex;flex-direction:column;align-items:center;gap:1cqw;pointer-events:none}
  #bigLabel{font-weight:700;font-size:8cqw;line-height:.95;text-align:center;color:#fff;
    text-shadow:0 0 3cqw currentColor,0 0 10cqw currentColor}
  #bigSub{font-weight:700;font-size:3.4cqw;letter-spacing:.24em;color:rgba(255,255,255,.55);
    text-transform:uppercase}

  /* raised well up toward the cup row (design was bottom:9cqw) so there's no dead
     gap between the numbered cups and the guess bar */
  #askWrap{position:absolute;left:12cqw;right:12cqw;bottom:27cqw;height:2cqw;
    border-radius:99px;overflow:hidden;background:rgba(255,255,255,.12);pointer-events:none;display:none}
  #askBar{height:100%;width:100%;background:#00e7ff;box-shadow:0 0 3cqw #00e7ff}

  #scoreCard{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:3cqw;padding:8cqw;box-sizing:border-box;pointer-events:none;
    background:linear-gradient(180deg,rgba(5,5,11,.93) 0%,rgba(5,5,11,.995) 55%)}
  #scoreTitle{font-weight:700;font-size:7cqw;line-height:1;text-align:center;color:#00e7ff;
    text-shadow:0 0 3cqw currentColor}
  #scoreList{display:flex;flex-direction:column;gap:1.6cqw;width:100%}
  .scoreRow{display:flex;align-items:center;gap:3cqw;padding:2.4cqw 3.4cqw;border-radius:2.2cqw;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
  .scoreRow .sr{font-weight:700;font-size:3cqw;letter-spacing:.2em;color:rgba(255,255,255,.36);
    text-transform:uppercase;flex:1}
  .scoreRow .sd{font-weight:700;font-size:3cqw;letter-spacing:.18em;text-transform:uppercase}
  .scoreRow .sc{font-weight:700;font-size:5cqw;color:#b4ff2e;width:10cqw;text-align:right}
  #scoreFoot{font-size:3cqw;letter-spacing:.2em;color:rgba(255,255,255,.42);
    text-transform:uppercase;text-align:center}

  /* preview: run the CSS pop; render: JS reproduces it deterministically */
  html:not(.rmode):not(.embed) #bigLabel{animation:fbPop .32s ease-out}
  html:not(.rmode):not(.embed) #scoreTitle{animation:fbPop .38s ease-out}
  html.rmode *, html.rmode *::before, html.rmode *::after{ animation:none !important; transition:none !important; }

  /* render mode: sit the game in a condensed, centred "safe box" with pure black
     all around it. TikTok lays its caption (bottom-left) and action rail (like /
     comment / share, right edge) directly over the video, so the whole game is
     scaled down and pulled in — everything inside scales with #stage (cq units +
     % canvas), so the layout is unchanged, just smaller. */
  html.rmode{
    background:#000;
    --safe-w:70vw;    /* game width vs the 1080 frame — smaller = more black on the sides + bottom */
    --safe-top:5vh;   /* black margin above the game — enough to clear TikTok's top tabs */
  }
  html.rmode body{ background:#000; }
  html.rmode #stage{
    position:absolute; left:50%; transform:translateX(-50%);
    top:var(--safe-top); width:var(--safe-w); height:auto; aspect-ratio:9/16;
    max-width:none; border-radius:0; box-shadow:none;
  }
  /* hook line in the black band just below the game (render only) */
  #subq{ display:none; }
  html.rmode #subq{
    display:block; position:absolute; left:0; right:0;
    top:calc(var(--safe-top) + var(--safe-w) * 16 / 9 + 2.6vh);
    text-align:center; white-space:nowrap;
    font:700 3.5vw/1 "Chakra Petch","DIN Alternate",system-ui,sans-serif;
    letter-spacing:.04em; color:rgba(255,255,255,.9);
    text-shadow:0 0 2.4vw rgba(0,231,255,.32);
  }
  #err{position:fixed;inset:0;display:none;padding:16px;background:#140808;color:#ff8080;
    font:13px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;z-index:99}

  /* ── preview studio — never rendered, hidden when embedded ── */
  html.rmode #studio, html.embed #studio{ display:none; }
  html.embed body{ padding:0; overflow:hidden; }
  html.embed #stage{ height:100dvh; max-width:100vw; }
  #studio{
    width:340px; flex:none; align-self:center;
    max-height:94dvh; overflow-y:auto;
    background:#0b0b14; border:1px solid #1d2b4a; border-radius:20px;
    box-shadow:0 30px 90px rgba(0,0,0,.6);
    padding:18px; display:flex; flex-direction:column; gap:12px;
    font-family:"Chakra Petch","DIN Alternate",system-ui,sans-serif;
  }
  #studio .hd{ font-weight:700; letter-spacing:.28em; font-size:11px; color:#00e7ff; text-transform:uppercase; }
  #studio button{
    font-family:inherit; font-weight:700; color:#fff; cursor:pointer;
    background:#141422; border:1px solid #2a2a3e; border-radius:10px;
    padding:9px 12px; font-size:13px; letter-spacing:.06em; transition:none;
  }
  #studio button:hover{ border-color:#00e7ff88; background:#191926; }
  #studio button.big{ padding:14px; font-size:15px; letter-spacing:.1em; }
  #studio button.big small{ display:block; font-weight:500; font-size:10px; letter-spacing:.14em; opacity:.55; margin-top:2px; }
  #studio button.primary{ background:rgba(0,231,255,.12); border-color:rgba(0,231,255,.5); color:#00e7ff; }
  #studio button.primary:hover{ background:rgba(0,231,255,.2); }
  #studio .row{ display:flex; align-items:center; gap:8px; }
  #studio .lbl{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.42); width:52px; flex:none; }
  #studio input[type=text]{ font-family:inherit; font-weight:700; color:#fff; flex:1; min-width:0;
    background:#141422; border:1px solid #2a2a3e; border-radius:9px; padding:8px 10px; font-size:13px; }
  #studio select{ font-family:inherit; font-weight:700; color:#fff; flex:1;
    background:#141422; border:1px solid #2a2a3e; border-radius:9px; padding:8px; font-size:13px; }
  #studio .seg{ display:flex; gap:4px; flex:1; }
  #studio .seg button{ flex:1; padding:7px 0; font-size:12px; }
  #studio .seg button.on{ background:rgba(0,231,255,.14); border-color:rgba(0,231,255,.5); color:#00e7ff; }
  #studio label.sw{ display:flex; align-items:center; gap:7px; font-size:12px; letter-spacing:.06em; color:rgba(255,255,255,.8); cursor:pointer; }
  #studio label.sw input{ accent-color:#00e7ff; width:15px; height:15px; }
  #studio #readout{ background:#141422; border:1px solid #2a2a3e; border-radius:10px;
    padding:11px 12px; font-size:13px; line-height:1.5; min-height:56px; font-variant-numeric:tabular-nums; }
  #studio #readout .dim{ color:rgba(255,255,255,.4); font-size:11px; letter-spacing:.04em; }
  #studio #toast{ font-size:11px; line-height:1.5; color:#00e7ff; word-break:break-all;
    font-family:ui-monospace,Menlo,monospace; min-height:0; }
  #studio .hint{ font-size:10.5px; color:rgba(255,255,255,.35); letter-spacing:.03em; }
  #studio kbd{ background:#141422; border:1px solid #2a2a3e; border-radius:4px; padding:0 4px; font-family:inherit; color:#00e7ff; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="720" height="1280"></canvas>
  <div id="hud">
    <div id="hudTop"><span id="roundLabel">ROUND 1/3</span><span id="diffLabel">EASY</span></div>
    <div id="pips"></div>
  </div>
  <div id="big">
    <span id="bigLabel">WATCH THE BALL</span>
    <span id="bigSub">Round 1 · 3 cups</span>
  </div>
  <div id="askWrap"><div id="askBar"></div></div>
  <div id="scoreCard">
    <span id="scoreTitle">HOW MANY<br>DID YOU GET?</span>
    <div id="scoreList"></div>
    <span id="scoreFoot">Comment your score 👇</span>
  </div>
</div>
<div id="subq">Can you follow the ball? 👀</div>

<div id="studio">
  <div class="hd">Follow The Ball · Preview</div>
  <button id="btnReplay" class="big primary">↻ REPLAY<small>fresh random seed</small></button>
  <div class="row">
    <button id="btnAgain" style="flex:1">AGAIN <span style="opacity:.5;font-weight:500">same seed</span></button>
    <label class="sw"><input type="checkbox" id="chkAuto"> auto</label>
  </div>
  <div class="row">
    <span class="lbl">Seed</span>
    <input type="text" id="seedIn" inputmode="numeric" spellcheck="false" />
    <button id="btnSeed">set</button>
  </div>
  <div class="row">
    <span class="lbl">Mode</span>
    <select id="modeIn"></select>
  </div>
  <div class="row">
    <span class="lbl">Speed</span>
    <div class="seg" id="speedSeg">
      <button data-s="0.5">0.5×</button><button data-s="1" class="on">1×</button>
      <button data-s="2">2×</button><button data-s="4">4×</button>
    </div>
  </div>
  <div class="row">
    <span class="lbl">Sound</span>
    <label class="sw"><input type="checkbox" id="chkSound"> play audio</label>
  </div>
  <div id="readout">…</div>
  <button id="btnRender" class="big primary">▶ RENDER THIS SEED</button>
  <div id="toast"></div>
  <div class="hint">press <kbd>S</kbd> anytime to star the current seed → <code>render-queue.txt</code></div>
</div>

<pre id="err"></pre>

<script>
  window.addEventListener('error', (e) => {
    const el = document.getElementById('err');
    if (el) { el.style.display = 'block'; el.textContent += ((e.error && e.error.stack) || e.message) + '\n'; }
    window.__FTB_ERROR = (e.error && e.error.stack) || e.message;
  });
  window.addEventListener('unhandledrejection', (e) => { window.__FTB_ERROR = String((e.reason && e.reason.stack) || e.reason); });
</script>
<script src="./game.js"></script>

<script>
/* ── preview studio wiring — only for the standalone preview page ── */
if (!document.documentElement.classList.contains('rmode')
    && !document.documentElement.classList.contains('embed')) (function () {
  const FTB = window.FTB;
  const $ = (id) => document.getElementById(id);
  const seedIn = $('seedIn'), modeIn = $('modeIn'), readout = $('readout'), toast = $('toast');
  const MODES = ['sprint', 'classic', 'insane', 'random'];
  const LABELS = { sprint: 'Sprint (3 rounds)', classic: 'Classic (5 rounds)', insane: 'Insane (5 rounds)', random: 'Surprise me' };
  modeIn.innerHTML = MODES.map((m) => `<option value="${m}">${LABELS[m]}</option>`).join('');
  modeIn.value = FTB.getMode();

  let toastT = 0;
  const say = (msg, ms = 3500) => { toast.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => (toast.textContent = ''), ms); };

  $('btnReplay').onclick = () => FTB.replay();
  $('btnAgain').onclick = () => FTB.again();
  $('btnSeed').onclick = () => { const v = seedIn.value.trim(); if (v) FTB.replay(v); };
  seedIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btnSeed').click(); });
  modeIn.onchange = () => FTB.setMode(modeIn.value);
  $('chkAuto').onchange = (e) => FTB.setAutoReplay(e.target.checked);
  $('chkSound').onchange = (e) => FTB.setSound(e.target.checked);
  $('speedSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    [...$('speedSeg').children].forEach((x) => x.classList.toggle('on', x === b));
    FTB.setSpeed(+b.dataset.s);
  });

  const post = (path, body) => fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });

  let pollT = 0;
  $('btnRender').onclick = async () => {
    const seed = FTB.getSeed(), mode = FTB.getMode();
    const cmd = `node scripts/followball/render.mjs --seed ${seed} --mode ${mode} --mux`;
    clearInterval(pollT);
    try {
      const r = await post('/render', { seed, mode });
      if (!r.ok) throw new Error(await r.text());
      const j = await r.json();
      say(`rendering ${j.file}…`, 60000);
      pollT = setInterval(async () => {
        try {
          const s = await (await fetch('/render-status?id=' + j.id)).json();
          const p = s.progress ? ` ${Math.round(s.progress.pct * 100)}% ${s.progress.msg}` : '';
          if (s.state === 'done') { clearInterval(pollT); say(`✅ ${s.file} → render/followball/out/`, 12000); }
          else if (s.state === 'failed') { clearInterval(pollT); say(`❌ render failed — see terminal`, 8000); }
          else say(`rendering ${s.file}…${p}`, 60000);
        } catch { clearInterval(pollT); }
      }, 700);
    } catch {
      try { await navigator.clipboard.writeText(cmd); say('no studio server — copied: ' + cmd, 12000); }
      catch { say(cmd, 15000); }
    }
  };

  window.addEventListener('keydown', async (e) => {
    if (e.key.toLowerCase() !== 's' || e.metaKey || e.ctrlKey) return;
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
    const seed = FTB.getSeed(), mode = FTB.getMode();
    try {
      const r = await post('/star', { seed, mode });
      if (!r.ok) throw new Error();
      say(`★ starred ${mode} ${seed} → render-queue.txt`);
    } catch {
      try { await navigator.clipboard.writeText(`${seed} ${mode}`); say(`★ ${seed} ${mode} (copied — no server)`, 5000); }
      catch { say(`★ ${seed} ${mode}`, 5000); }
    }
  });

  setInterval(() => {
    const r = FTB.readout();
    if (document.activeElement !== seedIn) seedIn.value = r.seed;
    if (modeIn.value !== r.mode) modeIn.value = r.mode;
    if (r.done) {
      readout.innerHTML = `<b style="color:#b4ff2e">Answers: ${r.answers.join('  ')}</b>`
        + `<br><span class="dim">${r.modeName} · seed ${r.seed} · ${r.rounds} rounds</span>`;
    } else {
      readout.innerHTML = `Round <b>${r.round}/${r.rounds}</b> · ${r.roundSec.toFixed(1)}s`
        + `<br><span class="dim">${r.modeName} · seed ${r.seed}${r.answers.length ? ' · so far: ' + r.answers.join(' ') : ''}</span>`;
    }
  }, 110);
})();
</script>
</body>
</html>
