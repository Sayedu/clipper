name: Daily TikTok post

# NO `schedule:` trigger here on purpose. GitHub's own cron silently failed
# to fire in 2 separate controlled tests (a real 3am run, and an isolated
# 35-minute-lead-time test workflow with nothing else going on) — this
# matches a known, unresolved pattern other people report for newer repos
# (GitHub Community discussions #203822, #185212: "scheduled workflows never
# trigger... workflow_dispatch works correctly"). Triggered externally
# instead — a free cron-job.org job calls this via the REST API
# (POST .../actions/workflows/daily-post.yml/dispatches), which is exactly
# the workflow_dispatch event below, just fired by a timer instead of a
# person clicking "Run workflow." Daily at 12:01 AM (cron-job.org's own
# configured time/timezone — not set here).
on:
  workflow_dispatch:
    inputs:
      force_pick:
        description: "Force one game instead of the random pick (colorwar / ringofdoom / followball / eyetest) — leave blank for normal behavior"
        required: false
        type: string

concurrency:
  group: daily-post
  cancel-in-progress: false

permissions:
  contents: write  # needed to push colorwars/league/season.json back after a Ring of Doom post

jobs:
  post:
    runs-on: ubuntu-latest
    # This run renders ALL 4 rotation games back to back, not just one.
    # Measured in CI: Follow The Ball ~8min, Eye Test ~14min (3 rounds of real
    # physics is heavier than it looks), Color War ~15min. Ring of Doom
    # (replaced Laser Nations Duel) mines 300 seeds first (pure physics, no
    # browser — well under a minute even on a shared 2-vCPU runner) then
    # renders whichever one scored best; real CI duration not yet measured,
    # budgeted generously here like the others. The repo is public, so
    # Actions minutes are unlimited — generous headroom costs nothing.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Install Chromium (for the headless render)
        # `npx playwright-core` (not `npx playwright`) — the project only depends on
        # playwright-core (see package.json), so this resolves to the LOCALLY
        # installed, package-lock-pinned version. Plain `npx playwright install`
        # fetches whatever's latest on npm, which downloads a different Chromium
        # build revision than what playwright-core actually expects at runtime —
        # that mismatch is exactly what failed the first test run.
        run: npx playwright-core install --with-deps chromium

      - name: Make sure ffmpeg is present
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up the small audio-synthesis venv
        # Only numpy/scipy/soundfile — the 3 JS-pipeline rotation games just
        # need procedural sound synthesis, none of the heavy ML stack
        # (torch/whisper/etc) that scripts/setup.sh installs for the full
        # sourced-video pipeline. Keeps this job fast instead of pulling in
        # gigabytes nothing here uses.
        run: |
          python3 -m venv python/.venv
          python/.venv/bin/pip install --quiet numpy soundfile scipy

      - name: Set up the colorwars venv (Ring of Doom's own engine)
        # colorwars/ is a separate Python project (pymunk + skia-python, its
        # own render/audio/league pipeline) from the JS games above — see
        # colorwars/CLAUDE.md. Its own requirements.txt, its own venv.
        run: |
          python3 -m venv colorwars/.venv
          colorwars/.venv/bin/pip install --quiet -r colorwars/requirements.txt

      - name: Render today's game and post it to TikTok via Buffer
        run: npx tsx scripts/post/daily.ts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          OUTPUT_REPO: ${{ secrets.OUTPUT_REPO }}
          OUTPUT_REPO_TOKEN: ${{ secrets.OUTPUT_REPO_TOKEN }}
          FORCE_PICK: ${{ inputs.force_pick }}
          # colorwars/config/settings.yaml hardcodes a local macOS dev path
          # for ffmpeg (that machine's bare `ffmpeg` is broken) — this
          # overrides it to the apt-installed one already on PATH here.
          COLORWARS_FFMPEG_PATH: ffmpeg

      - name: Persist Ring of Doom's season state (if it posted today)
        # `colorwars commit` (run by daily.ts's ringofdoom step, after a
        # successful Buffer post) only updates these files on THIS runner's
        # local checkout -- nothing pushes that back to the repo on its own.
        # Without this, the season would never actually advance: every run
        # would see the same un-committed season.json and keep rendering
        # "ep001" forever. A no-op is expected and fine on days ringofdoom
        # wasn't in the rotation, or failed before its commit step.
        if: always()
        run: |
          git add colorwars/league/season.json colorwars/league/names_used.txt
          if git diff --cached --quiet; then
            echo "no season state changes to persist"
          else
            git -c user.email=bot@clipper.local -c user.name=clipper-bot commit -m "post: advance Color Wars League season"
            git push
          fi
