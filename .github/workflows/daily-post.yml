name: Daily TikTok post

# NO `schedule:` trigger here on purpose. GitHub's own cron silently failed
# to fire in 2 separate controlled tests (a real 3am run, and an isolated
# 35-minute-lead-time test workflow with nothing else going on) — this
# matches a known, unresolved pattern other people report for newer repos
# (GitHub Community discussions #203822, #185212: "scheduled workflows never
# trigger... workflow_dispatch works correctly"). Triggered externally
# instead — a free cron-job.org job calls this via the REST API
# (POST .../actions/workflows/daily-post.yml/dispatches), which is exactly
# the workflow_dispatch event below, just fired by a timer instead of a
# person clicking "Run workflow." Daily at ~3:00 AM US Eastern.
on:
  workflow_dispatch:
    inputs:
      force_pick:
        description: "Force one game instead of the random pick (colorwar / lasernationsDuel / followball / eyetest) — leave blank for normal behavior"
        required: false
        type: string

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    # This run renders ALL 4 rotation games back to back, not just one.
    # Measured in CI: Follow The Ball ~8min, Eye Test ~14min (3 rounds of real
    # physics is heavier than it looks), Color War ~15min. Laser Nations Duel
    # has no fixed timer (runs a dramatic-fight seed search, then the actual
    # fight plays out until someone hits 0 hp) and ran notably longer in
    # testing — worst case all 4 summing past 120min is plausible. The repo is
    # public, so Actions minutes are unlimited — generous headroom costs nothing.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Install Chromium (for the headless render)
        # `npx playwright-core` (not `npx playwright`) — the project only depends on
        # playwright-core (see package.json), so this resolves to the LOCALLY
        # installed, package-lock-pinned version. Plain `npx playwright install`
        # fetches whatever's latest on npm, which downloads a different Chromium
        # build revision than what playwright-core actually expects at runtime —
        # that mismatch is exactly what failed the first test run.
        run: npx playwright-core install --with-deps chromium

      - name: Make sure ffmpeg is present
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up the small audio-synthesis venv
        # Only numpy/scipy/soundfile — the 3 rotation games just need procedural
        # sound synthesis, none of the heavy ML stack (torch/whisper/etc) that
        # scripts/setup.sh installs for the full sourced-video pipeline. Keeps
        # this job fast instead of pulling in gigabytes nothing here uses.
        run: |
          python3 -m venv python/.venv
          python/.venv/bin/pip install --quiet numpy soundfile scipy

      - name: Render today's game and post it to TikTok via Buffer
        run: npx tsx scripts/post/daily.ts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          OUTPUT_REPO: ${{ secrets.OUTPUT_REPO }}
          OUTPUT_REPO_TOKEN: ${{ secrets.OUTPUT_REPO_TOKEN }}
          FORCE_PICK: ${{ inputs.force_pick }}
