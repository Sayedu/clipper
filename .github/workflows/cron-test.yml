name: Cron trigger test (temporary)

# TEMPORARY — just proving GitHub's `schedule:` trigger actually fires for
# this repo, isolated from all the render/Buffer complexity. Delete this
# file once confirmed. Set ~35min out from creation, past the registration
# lag (15min-1hr+) that likely caused today's real 3am run to be skipped.
on:
  schedule:
    - cron: "56 15 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "cron trigger fired at $(date -u) — event was ${{ github.event_name }}"
